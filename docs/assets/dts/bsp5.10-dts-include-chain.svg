<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BSP 5.10 DTS include 层级</title>
  <desc id="desc">rk3568-gec-v11-linux.dts 包含板级 dtsi、Linux 通用 dtsi 和 VOP binding，板级 dtsi 再包含 rk3568.dtsi 与 rk3568-evb-gec.dtsi。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 48px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #526079; }
      .file { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 25px; font-weight: 700; }
      .note { font-size: 21px; fill: #526079; }
      .badge { font-size: 18px; font-weight: 700; }
      .output { font-size: 27px; font-weight: 700; fill: #075985; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text class="text title" x="800" y="66" text-anchor="middle">BSP 5.10 DTS include 层级</text>
  <text class="text subtitle" x="800" y="106" text-anchor="middle">当前入口：rk3568-gec-v11-linux.dts</text>

  <rect x="465" y="150" width="670" height="112" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
  <rect x="490" y="170" width="108" height="30" rx="6" fill="#bbf7d0"/>
  <text class="text badge" x="544" y="192" text-anchor="middle" fill="#166534">顶层入口</text>
  <text class="text file" x="800" y="220" text-anchor="middle">rk3568-gec-v11-linux.dts</text>
  <text class="text note" x="800" y="250" text-anchor="middle">汇总板级层、Linux 通用层与显示 binding</text>

  <line x1="800" y1="263" x2="800" y2="304" stroke="#475569" stroke-width="5"/>
  <line x1="370" y1="304" x2="1230" y2="304" stroke="#475569" stroke-width="5"/>
  <line x1="370" y1="304" x2="370" y2="342" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="800" y1="304" x2="800" y2="342" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1230" y1="304" x2="1230" y2="342" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="355" width="580" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
