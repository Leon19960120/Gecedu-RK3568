  <line x1="800" y1="474" x2="800" y2="716" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="1230" y1="474" x2="1230" y2="716" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="225" y1="681" x2="225" y2="716" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="660" y1="681" x2="660" y2="716" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 10"/>

  <rect x="165" y="730" width="1270" height="105" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text class="text output" x="800" y="775" text-anchor="middle">include 合并并编译</text>
  <text class="text file" x="800" y="814" text-anchor="middle">rk3568-gec-v11-linux.dtb</text>

  <text class="text note" x="800" y="872" text-anchor="middle">source DTS -> built DTB -> running DTB，三层证据必须逐级核对</text>
